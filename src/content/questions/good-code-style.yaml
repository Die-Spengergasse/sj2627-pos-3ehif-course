- id: gcs-dependency-direction
  unit: good-code-style/package-structure-and-foundation
  main:
    kind: single
    prompt: "A project has the packages `domain`, `service` and `foundation`. Which dependency is a **problem**?"
    options:
      - "A class in `foundation` imports a class from `domain`."
      - "A class in `service` imports a class from `domain`."
      - "A class in `domain` imports a class from `foundation`."
      - "A class in `service` imports a class from `foundation`."
    answer: 0
    explanation: |
      `foundation` holds generic helpers and must not know the problem domain: once it imports `domain`, it is no longer reusable, and you risk cycles (`domain` already uses `foundation`). The other three arrows point downwards (`service` → `domain` → `foundation`), which is the intended direction.
  followUps:
    - kind: single
      prompt: "Where does a method `merge(EnumMap a, EnumMap b, BiFunction f)` that combines two maps belong?"
      options:
        - "`foundation`, because it is generic and knows nothing about the problem."
        - "`domain`, because every domain class could use it."
        - "`service`, because it combines data."
        - "Into every class that needs it, so no package depends on another."
      answer: 0
      explanation: |
        It is a generic utility without any domain vocabulary, so `foundation` is right. Putting it into `domain` or `service` mixes generic code with problem-specific code, and copying it into every class repeats it, which is the opposite of a shared helper.

- id: gcs-guard-clause
  unit: good-code-style/package-structure-and-foundation
  main:
    kind: single
    prompt: "What is the main advantage of a guard clause such as `ensureNotNull(payments);` at the top of a method?"
    options:
      - "The program fails at the entry of the method with a clear message, not later at an unrelated line."
      - "The JVM can optimise the method better."
      - "The method can no longer receive invalid values from anywhere."
      - "A `NullPointerException` is turned into a checked exception."
    answer: 0
    explanation: |
      That is the *fail fast* principle: the error is reported where the wrong value enters, so the stack trace points to the cause. The JVM does not optimise differently. Guards do not prevent callers from passing bad values, they only reject them early. And `IllegalArgumentException` is unchecked, not a checked exception.
  followUps: []

- id: gcs-guard-lines
  unit: good-code-style/package-structure-and-foundation
  main:
    kind: line
    prompt: "Build a guard-clause helper that returns the checked value. One line is wrong."
    lines:
      - "public static <T> T ensureNotNull(T value) {"
      - "    if (value == null) {"
      - "        throw new IllegalArgumentException(\"value must not be null!\");"
      - "    }"
      - "    return value;"
      - "}"
    redHerrings:
      - "    if (value != null) {"
    explanation: |
      The guard must throw when the value **is** `null` (`value == null`). With `!=`, the helper would reject every valid value. Returning the value at the end lets callers chain it, e.g. `ensurePositive(ensureNotNull(x))`.
  followUps: []

- id: gcs-compact-constructor
  unit: good-code-style/rich-domain
  main:
    kind: template
    prompt: "Fill in the gaps so that a `Playlist` can never contain a `null` name or be changed through its list."
    template: |
      public {{record}} Playlist(String name, List<String> tracks) {
          public Playlist {
              ensureNotNull(name);
              tracks = List.{{copyOf}}(ensureNotNull(tracks));
          }
      }
    redHerrings:
      - "class"
      - "of"
      - "this.tracks"
    explanation: |
      A `record` has a compact constructor (no parameter list). Inside it you assign the **parameter** `tracks`; the record stores it in the field afterwards, so `this.tracks = ...` is not allowed there. `List.copyOf` makes an unmodifiable copy, whereas `List.of(tracks)` would create a list *containing* the list. A `class` has no compact constructor.
  followUps: []

- id: gcs-shallow-immutable
  unit: good-code-style/rich-domain
  main:
    kind: single
    prompt: "What does this code print?"
    code: |
      record Box(List<String> items) { }

      var list = new ArrayList<>(List.of("a"));
      var box = new Box(list);
      list.add("b");
      System.out.println(box.items());
    options:
      - "`[a, b]`"
      - "`[a]`"
      - "Nothing: `list.add` throws an exception."
      - "It does not compile, because records are immutable."
    answer: 0
    explanation: |
      Record fields are `final`, but that only protects the **reference**. The record holds the same `ArrayList` as the caller, so changes show up inside the record. To make it really immutable, copy in the compact constructor: `items = List.copyOf(items);`. Then the output would be `[a]`.
  followUps:
    - kind: multi
      prompt: "Which measures keep a record with a `List` component immutable?"
      options:
        - "Copy the list with `List.copyOf` in the compact constructor."
        - "Return a modified copy from methods such as `withItem(...)` instead of changing the list."
        - "Mark the component with the `final` keyword in the record header."
        - "Do not provide a setter method."
      answer: [0, 1]
      explanation: |
        The defensive copy and "change means a new record" are what protect the contents. `final` in the record header is not allowed and would add nothing, because components are final anyway. A record has no setters to leave out, and a missing setter does not stop callers from modifying a shared list.

- id: gcs-tell-dont-ask
  unit: good-code-style/rich-domain
  main:
    kind: single
    prompt: "Which version follows *tell, don't ask*?"
    options:
      - "`int count = denomination.countAmountIn(rest);`"
      - "`int count = rest / denomination.getValue();`"
      - "`int count = rest / Denomination.values()[0].getValue();`"
      - "`int count = rest / (denomination.getValue());`"
    answer: 0
    explanation: |
      Only the first version asks the denomination a question and gets the answer. The others read the internal value and calculate outside, so every caller repeats the knowledge of how a denomination works, and the field cannot become private. The last one differs from the second only by parentheses.
  followUps:
    - kind: multi
      prompt: "Which are signs of an *ask* design?"
      options:
        - "A service calls `getX()` on an object, calculates, and calls `setX(...)` with the result."
        - "Several classes repeat the same calculation on an object's fields."
        - "An object offers a method like `addDenomination(d, count)` that updates itself."
        - "Fields of the domain objects are read from outside through getters just to compute something."
      answer: [0, 1, 3]
      explanation: |
        Pulling data out, calculating elsewhere and pushing it back (or repeating the calculation in several places) is the ask style. `addDenomination` is the opposite: the envelope keeps its own total up to date and returns the new state.

- id: gcs-immutable-update
  unit: good-code-style/rich-domain
  main:
    kind: line
    prompt: "Order the lines of an immutable `addDenomination` method. One line does not belong."
    lines:
      - "public Envelope addDenomination(Denomination denomination, int amount) {"
      - "    var newBreakdown = new EnumMap<>(breakdown);"
      - "    newBreakdown.merge(denomination, amount, Integer::sum);"
      - "    return new Envelope(newBreakdown, totalValue + denomination.amountOf(amount));"
      - "}"
    redHerrings:
      - "    breakdown.merge(denomination, amount, Integer::sum);"
    explanation: |
      An immutable object copies its state, changes the copy and returns a **new** object. Calling `merge` on the existing `breakdown` would modify the old envelope, which everyone who shares it would notice.
  followUps: []

- id: gcs-magic-numbers
  unit: good-code-style/clean-code-details
  main:
    kind: single
    prompt: "Which line contains a magic number that should get a name?"
    options:
      - "`if (order.totalCents() > 5000) { applyFreeShipping(); }`"
      - "`for (int i = 0; i < names.size(); i++)`"
      - "`int next = index + 1;`"
      - "`int half = list.size() / 2;`"
    answer: 0
    explanation: |
      The reader cannot tell what `5000` means (cents? a threshold?). `FREE_SHIPPING_THRESHOLD_CENTS` says it. `0`, `1` and `2` in loops, increments and halving are obvious from the context and do not need constants.
  followUps: []

- id: gcs-comments
  unit: good-code-style/clean-code-details
  main:
    kind: multi
    prompt: "Which comments add something and should stay?"
    options:
      - "`// € 500 notes are left out on purpose: banks no longer hand them out`"
      - "`// increase i by one` above `i++`"
      - "`// convenience constructor` above `public Envelope() { ... }`"
      - "`// payment must be whole euros, cents are never paid out in cash`"
    answer: [0, 3]
    explanation: |
      Good comments explain **why** or state a rule that the code cannot express. The other two only repeat what the code already says, and they become wrong when the code changes but the comment does not.
  followUps:
    - kind: single
      prompt: "A method has a comment `// go over each denomination and fill the envelope` in front of a block of 6 lines. What is the best first step?"
      options:
        - "Extract the block into a method named after what it does, so the comment is not needed."
        - "Keep the comment and add another one for each line."
        - "Delete the comment and leave the block as it is."
        - "Move the block into a static initialiser."
      answer: 0
      explanation: |
        When a block needs a comment to be understood, a method name can say the same thing and cannot get out of date as easily. Deleting the comment alone loses the explanation, more comments add noise, and an initialiser has nothing to do with it.

- id: gcs-naming
  unit: good-code-style/clean-code-details
  main:
    kind: single
    prompt: "Which set of names follows the usual Java conventions best?"
    options:
      - "`record Envelope`, method `addDenomination`, boolean `isEmpty`"
      - "`record Envelope`, method `denomination`, boolean `empty`"
      - "`record EnvelopeManager`, method `data`, boolean `flag`"
      - "`record envelope`, method `AddDenomination`, boolean `IS_EMPTY`"
    answer: 0
    explanation: |
      Types are nouns in `UpperCamelCase`, methods are verbs in `lowerCamelCase`, and booleans read like a question (`isEmpty`). The second set has a noun as a method and an unclear boolean. The third uses technical filler (`Manager`, `data`, `flag`). The fourth breaks the capitalisation rules (`UPPER_SNAKE_CASE` is for constants).
  followUps: []
